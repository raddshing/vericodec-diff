paths:
  repo_root: .
  official_diffusers_script: baselines/external/huggingface_diffusers/examples/dreambooth/train_dreambooth_lora_sdxl.py
  accelerate_config: configs/accelerate/single_gpu_fp16.yaml
  expected_diffusers_substring: huggingface_diffusers

model:
  pretrained_model_name_or_path: stabilityai/stable-diffusion-xl-base-1.0
  pretrained_vae_model_name_or_path: null
  revision: null
  variant: null

training:
  resolution: 1024
  train_batch_size: 1
  gradient_accumulation_steps: 1
  max_train_steps: 1
  checkpointing_steps: 1
  checkpoints_total_limit: 1
  learning_rate: 1.0e-4
  lr_scheduler: constant
  lr_warmup_steps: 0
  lr_num_cycles: 1
  lr_power: 1.0
  report_to: tensorboard
  mixed_precision: fp16
  dataloader_num_workers: 0
  num_validation_images: 1
  validation_epochs: 1000
  center_crop: true
  random_flip: false
  gradient_checkpointing: true
  scale_lr: false
  allow_tf32: false
  use_8bit_adam: false
  enable_xformers_memory_efficient_attention: false
  optimizer: AdamW
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1.0e-4
  adam_weight_decay_text_encoder: 1.0e-3
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  lora_dropout: 0.0
  repeats: 1
  seed: 20260410
  use_rslora: true
  target_modules:
    - to_k
    - to_q
    - to_v
    - to_out.0

tasks:
  subject_personalization:
    train_data_dir: tests/fixtures/rdlora_pilot
    instance_prompt: a studio portrait of the subject
    validation_prompt: A studio portrait of the same subject.
  style_domain:
    train_data_dir: tests/fixtures/rdlora_pilot
    instance_prompt: an image rendered in the target style domain
    validation_prompt: A poster in the target style domain.

training_output:
  success_status: completed
  required_files:
    - run_provenance.json
    - train_summary.json
    - metrics.json
    - checkpoint_info.json

thresholds:
  top_20_mass_ratio: 0.60
  held_out_spearman_rho: 0.50
  top_5_precision: 0.60
  proposed_relative_vs_uniform: 0.10
  probe_allocation_overhead_ratio: 1.5

policies:
  required_backends:
    - uniform
    - layer_only
    - timestep_only
    - proposed
  primary_metric: score
  forbidden_path_tokens:
    - mock
    - smoke
    - cpu_smoke
    - cpu_debug
    - stageb_cpu_smoke
    - stagec_cpu_smoke

evaluation:
  primary_metric: score
