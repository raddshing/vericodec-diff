paths:
  repo_root: .
  official_diffusers_script: baselines/external/huggingface_diffusers/examples/text_to_image/train_text_to_image_lora_sdxl.py
  accelerate_config: configs/accelerate/single_gpu_fp16.yaml
  expected_diffusers_substring: huggingface_diffusers

launcher:
  kind: accelerate
  executable: accelerate
  num_processes: 1

model:
  pretrained_model_name_or_path: stabilityai/stable-diffusion-xl-base-1.0

probe:
  candidate_ranks:
    - 0
    - 2
    - 4
    - 8
    - 16
  sample_count: 2
  vector_size: 8

surrogate:
  feature_names:
    - candidate_rank
    - rank_fraction_of_max
    - is_attention_cell
    - layer_count
    - step_count
    - event_count
    - baseline_mean_abs_drift
    - mean_abs_drift
    - rms_drift
    - max_abs_drift
    - cosine_distance
    - baseline_attention_output_mean_abs_drift
    - attention_output_mean_abs_drift
    - attention_output_rms_drift
    - attention_output_max_abs_drift
    - attention_output_cosine_distance
    - mean_abs_improvement
    - attention_mean_abs_improvement
    - has_attention_measurements
  l2_regularization: 1.0e-6
  clip_min_utility: 0.0
  round_digits: 6
  val_modulus: 5

allocation:
  rank_budget_total: 96
  utility_scale: 1000000
  max_exact_state_count: 500000

training:
  resolution: 1024
  train_batch_size: 1
  gradient_accumulation_steps: 1
  max_train_steps: 10
  checkpointing_steps: 10
  learning_rate: 0.0001
  lr_scheduler: constant
  lr_warmup_steps: 0
  report_to: tensorboard
  mixed_precision: fp16
  dataloader_num_workers: 0
  num_validation_images: 1
  validation_epochs: 1
  center_crop: true
  gradient_checkpointing: true
  use_rslora: true
  target_modules:
    - to_k
    - to_q
    - to_v
    - to_out.0

tasks:
  subject_personalization:
    train_data_dir: tests/fixtures/rdlora_pilot
    validation_prompt: A studio portrait of the same subject.
  style_domain:
    train_data_dir: tests/fixtures/rdlora_pilot
    validation_prompt: A poster in the target style domain.
