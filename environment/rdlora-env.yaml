# SDXL-first environment plan for the RD-LoRA baseline pack.
# Base compatibility target: official T-LoRA SDXL plus the official diffusers
# DreamBooth SDXL LoRA path.
# For the exact pinned diffusers main examples under
# baselines/external/huggingface_diffusers, reinstall the local checkout into
# this environment after creation:
#   pip install -e ./baselines/external/huggingface_diffusers
# The current diffusers text-to-image SDXL LoRA example on main asks for newer
# peft than T-LoRA, so treat that as a disposable overlay rather than the
# default critical-path environment.
# IntLoRA remains appendix-only and keeps its official Python 3.9 / CUDA 11.8
# environment separate from this SDXL substrate plan.
name: rdlora-env
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pytorch=2.6.0
  - torchvision=0.21.0
  - pytorch-cuda=12.1
  - pip
  - git
  - git-lfs
  - numpy
  - pillow
  - scipy
  - pandas
  - matplotlib
  - jupyterlab
  - ipykernel
  - pip:
      - accelerate==0.26.1
      - datasets>=2.19.1
      - diffusers==0.25.1
      - einops==0.8.1
      - ftfy==6.3.1
      - huggingface-hub==0.25.0
      - imageio==2.37.0
      - jinja2==3.1.5
      - omegaconf==2.3.0
      - opencv-python==4.11.0.86
      - peft==0.7.0
      - pyyaml==6.0.2
      - requests==2.32.3
      - safetensors==0.5.2
      - scikit-image==0.25.1
      - seaborn==0.13.2
      - tensorboard
      - tensorly==0.8.1
      - tqdm==4.67.1
      - transformers==4.37.1
      - wandb==0.19.6
